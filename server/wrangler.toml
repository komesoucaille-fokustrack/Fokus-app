# Serveur de notifications Fokus (Cloudflare Workers, offre gratuite)
# Déployé automatiquement par .github/workflows/push-server.yml (secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID).
name = "fokus-push"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Une instance « User » par appareil abonné (une alarme par notification programmée) + une instance « Keys » (clés VAPID)
[[durable_objects.bindings]]
name = "USERS"
class_name = "User"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "Keys"

# Une instance « Account » par compte Google (sauvegarde de la progression)
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["User", "Keys"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]

# Statistiques du tableau de bord (une seule instance, base SQLite)
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Stats"]

[vars]
# adresses autorisées à appeler le serveur (séparées par des virgules : ajouter ici un futur nom de domaine)
ALLOWED_ORIGIN = "https://komesoucaille-fokustrack.github.io,https://fokus-track.com,https://www.fokus-track.com"
# page de l'app (retour après connexion Google en mode redirection)
APP_URL = "https://komesoucaille-fokustrack.github.io/Fokus-app/"
# identifiant client OAuth Google (public) : console.cloud.google.com → Identifiants ; vide = comptes désactivés
GOOGLE_CLIENT_ID = ""
# expéditeur des codes de connexion (domaine vérifié chez Resend) ; la clé RESEND_API_KEY est un secret (GitHub → Actions)
MAIL_FROM = "Fokus <connexion@fokus-track.com>"
CONTACT = "https://komesoucaille-fokustrack.github.io/Fokus-app/"
