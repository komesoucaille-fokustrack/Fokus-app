name: Déploiement GitHub Pages
# L'app (branche main) à la racine, le labo (branche labo) dans /labo/. Un envoi sur « labo » relance ce déploiement
# (workflow labo.yml) : l'app publiée reste celle de main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Labo (fokus-track.com/labo/) : la branche « labo » construite à part, données séparées, jamais indexée
      - name: Récupérer la branche labo
        id: labo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: labo
          path: labo-src
      - name: Construire le labo
        if: steps.labo.outcome == 'success'
        working-directory: labo-src
        run: |
          npm ci
          VITE_LABO=1 npx vite build --outDir ../dist/labo --emptyOutDir
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
