# Déploie le serveur de notifications (server/) sur Cloudflare Workers.
# Secrets du dépôt nécessaires : CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (voir README → Notifications) ;
# facultatif : RESEND_API_KEY (connexion par code e-mail).
name: Serveur de notifications

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/push-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Secrets Cloudflare absents : déploiement ignoré (voir README → Notifications)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Tester le chiffrement Web Push
        if: steps.check.outputs.ok == 'true'
        working-directory: server
        run: npm ci && npm test
      - name: Déployer sur Cloudflare
        if: steps.check.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: '4.151.3'
      # Clé Resend (connexion par code e-mail) : transmise au serveur comme secret si elle existe dans le dépôt
      - name: Clé d'envoi des e-mails
        if: steps.check.outputs.ok == 'true'
        working-directory: server
        env:
          RESEND: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$RESEND" ]; then printf '%s' "$RESEND" | npx wrangler secret put RESEND_API_KEY; else echo "Pas de clé Resend : connexion par e-mail désactivée."; fi
      - name: Vérifier que le serveur répond
        if: steps.check.outputs.ok == 'true'
        run: |
          sleep 5
          curl -fsS https://fokus-push.kome-soucaille.workers.dev/ && echo
          curl -fsS https://fokus-push.kome-soucaille.workers.dev/vapid | head -c 120 && echo
